<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WGU Student Support</title>
  <link rel="stylesheet" href="assets/wgu-finance-minimal.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">WGU Student Support</div>
        <div class="student-heading">
          <h1 data-bind="full_name">Loading student...</h1>
          <span class="pill verified">Verified</span>
          <span class="pill" data-bind="student_type">Active</span>
        </div>
        <p class="subline"><span data-bind="key">-</span> · <span data-bind="program">-</span></p>
      </div>
      <div class="interaction">Voice interaction | Live advisor</div>
    </header>

    <div id="setupWarning" class="setup-warning" hidden></div>

    <main class="workspace">
      <section class="content-card" id="snapshot">
        <div class="section-head">
          <h2>Student snapshot</h2>
          <span class="status-chip" data-bind="risk_flag">Risk</span>
        </div>

        <div class="summary-grid compact">
          <div class="field">
            <span>Student ID</span>
            <strong data-bind="key">-</strong>
          </div>
          <div class="field">
            <span>Status</span>
            <strong data-bind="enrollment_status">-</strong>
          </div>
          <div class="field">
            <span>Program</span>
            <strong data-bind="program">-</strong>
          </div>
          <div class="field">
            <span>Mentor</span>
            <strong data-bind="mentorName">-</strong>
          </div>
          <div class="field">
            <span>Phone</span>
            <strong data-bind="phone_number">-</strong>
          </div>
          <div class="field">
            <span>Email</span>
            <strong data-bind="email">-</strong>
          </div>
        </div>

        <div class="two-column tight">
          <article class="mini-card">
            <h3>Contact reason</h3>
            <p data-bind="contactReason">Financial hold may prevent registration.</p>
          </article>
          <article class="mini-card">
            <h3>Course focus</h3>
            <p data-bind="current_course_focus">-</p>
          </article>
        </div>

        <article class="mini-card note-card">
          <h3>Student note</h3>
          <p data-bind="student_notes">-</p>
        </article>
      </section>

      <aside class="side-card" aria-label="Actions and activity">
        <div class="section-head small">
          <h2>Actions</h2>
        </div>
        <div class="action-list">
          <button type="button" data-action="openFinancial">Financial details</button>
          <button type="button" data-action="scheduleAdvisor">Schedule advisor call</button>
          <button type="button" data-action="openAccount">Student account</button>
        </div>

        <div class="activity-box">
          <h3>Activity</h3>
          <ol id="activityLog"></ol>
        </div>
      </aside>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" aria-label="Close" data-close-modal>×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <script src="assets/wgu-finance-minimal.js"></script>
</body>
</html>
