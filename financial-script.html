<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WGU Financial Details</title>
  <link rel="stylesheet" href="assets/wgu-finance-minimal.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">WGU Student Support</div>
        <div class="student-heading">
          <h1>Financial details</h1>
          <span class="pill verified">Verified</span>
        </div>
        <p class="subline"><span data-bind="full_name">Loading student...</span> · Student ID <span data-bind="key">-</span></p>
      </div>
      <a class="secondary-btn header-link" id="backToProfile" href="agent-script.html">Go back to student profile</a>
    </header>

    <div id="setupWarning" class="setup-warning" hidden></div>

    <main class="workspace">
      <section class="content-card" id="financial">
        <div class="section-head">
          <h2>Account summary</h2>
          <span class="status-chip amber" data-bind="account_hold_display">Hold</span>
        </div>

        <div class="finance-strip">
          <div>
            <span>Balance</span>
            <strong data-bind="balance_due">-</strong>
          </div>
          <div>
            <span>Aid status</span>
            <strong data-bind="financial_aid_status">-</strong>
          </div>
          <div>
            <span>Expected aid</span>
            <strong data-bind="aid_disbursement_date">-</strong>
          </div>
          <div>
            <span>Due date</span>
            <strong data-bind="payment_due_date">-</strong>
          </div>
        </div>

        <button class="plan-card full-width-plan" type="button" data-action="viewPlans">
          <span>Eligible payment plan</span>
          <strong data-bind="payment_plan_available_display">Available</strong>
          <small>View 3-payment and 4-payment breakdowns</small>
        </button>

        <article class="mini-card">
          <h3>Financial aid awards</h3>
          <dl class="kv-list compact-kv">
            <div><dt>Approved</dt><dd data-bind="approved_aid_amount">-</dd></div>
            <div><dt>Grant</dt><dd data-bind="grant_amount">-</dd></div>
            <div><dt>Loan</dt><dd data-bind="loan_amount">-</dd></div>
            <div><dt>Reference</dt><dd data-bind="payment_reference_id">-</dd></div>
          </dl>
        </article>
      </section>

      <aside class="side-card" aria-label="Financial actions and activity">
        <div class="section-head small">
          <h2>Actions</h2>
        </div>
        <div class="action-list">
          <button type="button" data-action="sendPlanEmail">Send payment plan link</button>
          <button type="button" data-action="openAccount">Open student account</button>
          <button type="button" data-action="createSfs">Create Financial Services follow-up</button>
          <button type="button" data-action="transferTier2">Transfer to Tier II / Specialist</button>
        </div>

        <div class="activity-box">
          <h3>Activity</h3>
          <ol id="activityLog"></ol>
        </div>
      </aside>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" aria-label="Close" data-close-modal>×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <script src="assets/wgu-finance-minimal.js"></script>
</body>
</html>
